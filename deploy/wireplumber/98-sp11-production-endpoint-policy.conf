# SP11 FullIO production endpoint policy.
#
# The physical ALSA speaker remains the real backend driven by UbiG, but it is
# not a user-selectable desktop endpoint.  Explicit UbiG node.target links keep
# working while GNOME/WirePlumber endpoint pickers suppress the backend.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.hidden = true
        priority.session = 0
      }
    }
  }
]
