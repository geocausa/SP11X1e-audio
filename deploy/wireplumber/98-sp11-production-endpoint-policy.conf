# SP11 FullIO production endpoint policy.
#
# The physical ALSA speaker remains the real backend driven by UbiG.  Mark it
# hidden/priority-zero for native policy.  GNOME enumerates outputs through the
# pipewire-pulse bridge, so 99-sp11-pulse-hide-hardware.conf + its Lua script
# additionally remove read permission to this node from that bridge only.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.hidden = true
        priority.session = 0
      }
    }
  }
]
