# Surface Pro 11 (MSHW0486 REV_0D) HiFi use case
#
# Evidence:
# - surface_audiominiext8380.inf Speaker_REV_0D DefaultDeviceVolume=0xFFF40000
#   (= -12.0 dB in 16.16 fixed point, hence Digital Volume 72 on the 0..84 scale)
# - QCAUD WaveSpeaker format: 2ch, 48 kHz, 16-bit, channel mask 0x3
# - MSHW0486 disables local headset endpoints; this profile stays speaker-only.
#   The card's 'Headphone Jack' / 'Mic Jack' kcontrols come from the machine
#   driver and are inert on this chassis.
#
# VOLUME POLICY (corrected 2026-07-25) ----------------------------------------
# The previous note here claimed WirePlumber's spa.alsa "does not recognize UCM
# remap". That was a misdiagnosis. The remap was broken because the card conf
# included the wsa884x FOUR-speaker init, which maps 'Speakers Volume' onto
# Woofer*/Tweeter* PA Volume controls that do not exist on this two-speaker
# machine. That is now fixed in MICROSOFT-Surface-Pro-11in.conf.
#
# Software volume is nevertheless retained DELIBERATELY, and no PlaybackVolume
# is declared on this device. Reason: 'SpkrLeft/SpkrRight PA Volume' is a 0..10
# control with dBscale-min=-9.00dB, step=1.50dB -- a 15 dB total range in 1.5 dB
# steps. Handing that to WirePlumber as the endpoint volume would leave "0%"
# still sounding at -9 dB and give the user a 10-step slider, which is worse
# than software volume. PA is therefore pinned at 6 (= 0 dB), leaving +6 dB of
# analog headroom unused, and all user-facing volume stays in PipeWire.
#
# If hardware volume is wanted later, the correct control is NOT PA Volume but
# 'WSA WSA_RX0/RX1 Digital Volume' (0..84, 1 dB steps, 84 dB range), which needs
# its own ctl-remap merging RX0+RX1 into one stereo control. Note that doing so
# reassigns the -12 dB Windows default from "the fixed operating point" to
# "the default slider position", which is arguably closer to Windows behaviour.
#
# SPEAKER PROTECTION ----------------------------------------------------------
# The protected boot enables both amplifier sense paths and both channels of
# the single WSA macro VI input.  Kernel patch 0005 keeps the three protection
# ports out of the playback-direction SoundWire stream (the former bus-clash
# cause), while the integrated AudioReach graph owns the exact WSA capture
# endpoints and Windows calibration sequence.

SectionVerb {
        EnableSequence [
                cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
                cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
                cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
                cset "name='WSA WSA_RX0 Digital Mute' 0"
                cset "name='WSA WSA_RX1 Digital Mute' 0"
                cset "name='WSA WSA_RX0 Digital Volume' 72"
                cset "name='WSA WSA_RX1 Digital Volume' 72"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 1"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 1"
        ]

        DisableSequence [
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 0"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 0"
        ]

        Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
        # Wsa1SpeakerEnableSeq = WSA macro instance 1, NOT "one speaker".
        # It sets both RX0 and RX1 MUX/INP on macro 1, which is correct for a
        # single-macro two-amp machine. Do not "fix" this to a two-speaker name;
        # no such file exists.
        Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

        Value {
                TQ "HiFi"
        }
}

SectionDevice."Speaker" {
        Comment "Speaker playback"

        EnableSequence [
                cset "name='SpkrLeft COMP Switch' 1"
                cset "name='SpkrLeft BOOST Switch' 1"
                cset "name='SpkrLeft DAC Switch' 1"
                cset "name='SpkrLeft PBR Switch' 1"
                cset "name='SpkrLeft VISENSE Switch' 1"
                cset "name='SpkrLeft CPS Switch' 1"
                cset "name='SpkrLeft WSA MODE' 0"
                cset "name='SpkrLeft PA Volume' 6"
                cset "name='SpkrRight COMP Switch' 1"
                cset "name='SpkrRight BOOST Switch' 1"
                cset "name='SpkrRight DAC Switch' 1"
                cset "name='SpkrRight PBR Switch' 1"
                cset "name='SpkrRight VISENSE Switch' 1"
                cset "name='SpkrRight CPS Switch' 1"
                cset "name='SpkrRight WSA MODE' 0"
                cset "name='SpkrRight PA Volume' 6"
        ]

        DisableSequence [
                cset "name='SpkrLeft COMP Switch' 0"
                cset "name='SpkrLeft BOOST Switch' 0"
                cset "name='SpkrLeft DAC Switch' 0"
                cset "name='SpkrLeft PBR Switch' 0"
                cset "name='SpkrLeft VISENSE Switch' 0"
                cset "name='SpkrLeft CPS Switch' 0"
                cset "name='SpkrRight COMP Switch' 0"
                cset "name='SpkrRight BOOST Switch' 0"
                cset "name='SpkrRight DAC Switch' 0"
                cset "name='SpkrRight PBR Switch' 0"
                cset "name='SpkrRight VISENSE Switch' 0"
                cset "name='SpkrRight CPS Switch' 0"
        ]

        Value {
                PlaybackChannels 2
                PlaybackPriority 100
                PlaybackPCM "hw:${CardId},0"
        }
}

SectionDevice."Mic" {
        Comment "Internal microphones"

        Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
        Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
        Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
        Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

        Value {
                CapturePriority 100
                CapturePCM "hw:${CardId},3"
        }
}
