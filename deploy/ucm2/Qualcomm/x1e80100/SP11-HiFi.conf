# Surface Pro 11 (MSHW0486 REV_0D) HiFi use case
#
# Evidence:
# - surface_audiominiext8380.inf Speaker_REV_0D declares both:
#     DefaultDeviceVolume=0xFFF40000 (-12.0 dB initial endpoint position)
#     MaxEpVolume=0x00000000 (0 dB endpoint maximum)
#   The initial endpoint position must not be reused as a fixed WSA gain.
# - QCAUD WaveSpeaker format: 2ch, 48 kHz, 16-bit, channel mask 0x3
# - MSHW0486 disables local headset endpoints; this profile stays speaker-only.
#   The card's 'Headphone Jack' / 'Mic Jack' kcontrols come from the machine
#   driver and are inert on this chassis.
#
# VOLUME POLICY (corrected 2026-07-25) ----------------------------------------
# The previous note here claimed WirePlumber's spa.alsa "does not recognize UCM
# remap". That was a misdiagnosis. The remap was broken because the card conf
# included the wsa884x FOUR-speaker init, which maps 'Speakers Volume' onto
# Woofer*/Tweeter* PA Volume controls that do not exist on this two-speaker
# machine. That is now fixed in MICROSOFT-Surface-Pro-11in.conf.
#
# Software volume is retained DELIBERATELY, and no PlaybackVolume is declared
# on this device.  Fresh Windows qcaucd KDNET proves DRE_CTL_1 (the ALSA
# SpkrLeft/Right PA Volume backing register) is initialized to 0x00 and is not
# rewritten on ordinary PA start/stop.  ALSA's PA Volume control is inverted:
# user value 31 maps the CSR gain field to raw zero.  Pin 31 here so UCM wins
# over any persisted alsactl mixer state; patch 0055 keeps CSR_GAIN_EN clear.
# This register is the compander-off fallback path, not the Windows endpoint
# volume actuator.  User-facing endpoint gain is reproduced downstream in the
# protected AudioReach final VOL_CTRL / GainStep path.
#
# The X1E machine driver caps these controls at 81 (-3 dB) until active speaker
# protection exists. This protected graph now provides VI feedback, so UCM pins
# both channels at that safe ceiling instead of the incorrect -12 dB point.
#
# SPEAKER PROTECTION ----------------------------------------------------------
# The protected kernel couples one 8 kHz/S32 stereo VI sidechain to speaker
# playback. Each WSA8845 contributes its VISENSE source port (mapped to master
# ports 10 and 11); the WSA macro combines them on WSA_CODEC_DMA_TX_0. The
# kernel enables SP/SPVI only after that SoundWire stream is prepared and
# explicitly bypasses both modules if the sidechain is unavailable.

SectionVerb {
        EnableSequence [
                cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
                # Keep LPASS soft-clip disabled. Windows has not been observed
                # enabling this block, and the old Linux v2.5 driver addressed
                # its control bits as v2.1 COMPANDER1 coefficient registers.
                # Set zero explicitly so stale userspace state cannot re-enable
                # the unproven path at stream start.
                cset "name='WSA WSA_Softclip0 Enable' 0"
                cset "name='WSA WSA_Softclip1 Enable' 0"
                cset "name='WSA WSA_RX0 Digital Mute' 0"
                cset "name='WSA WSA_RX1 Digital Mute' 0"
                cset "name='WSA WSA_RX0 Digital Volume' 81"
                cset "name='WSA WSA_RX1 Digital Volume' 81"

                # The protected render FE opens its coupled VI backend while
                # PipeWire probes the PCM, before SectionDevice."Speaker" is
                # enabled.  The generic two-speaker sequence leaves VISENSE
                # off, making SPKR_VI return -ENODEV and preventing the
                # Speaker device from ever being created.  Establish the
                # complete SP11 transport here, before the first PCM open.
                cset "name='SpkrLeft COMP Switch' 1"
                cset "name='SpkrLeft BOOST Switch' 1"
                cset "name='SpkrLeft DAC Switch' 1"
                cset "name='SpkrLeft PBR Switch' 1"
                cset "name='SpkrLeft VISENSE Switch' 1"
                cset "name='SpkrLeft WSA MODE' 0"
                cset "name='SpkrLeft PA Volume' 31"
                cset "name='SpkrRight COMP Switch' 1"
                cset "name='SpkrRight BOOST Switch' 1"
                cset "name='SpkrRight DAC Switch' 1"
                cset "name='SpkrRight PBR Switch' 1"
                cset "name='SpkrRight VISENSE Switch' 1"
                cset "name='SpkrRight WSA MODE' 0"
                cset "name='SpkrRight PA Volume' 31"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 1"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 1"
        ]

        # Wsa1SpeakerEnableSeq = WSA macro instance 1, NOT "one speaker".
        # It sets both RX0 and RX1 MUX/INP on macro 1, which is correct for a
        # single-macro two-amp machine. Do not "fix" this to a two-speaker name;
        # no such file exists.
        Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

        Value {
                TQ "HiFi"
        }
}

SectionDevice."Speaker" {
        Comment "Speaker playback"

        EnableSequence [
                cset "name='SpkrLeft COMP Switch' 1"
                cset "name='SpkrLeft BOOST Switch' 1"
                cset "name='SpkrLeft DAC Switch' 1"
                cset "name='SpkrLeft PBR Switch' 1"
                cset "name='SpkrLeft VISENSE Switch' 1"
                cset "name='SpkrLeft WSA MODE' 0"
                cset "name='SpkrLeft PA Volume' 31"
                cset "name='SpkrRight COMP Switch' 1"
                cset "name='SpkrRight BOOST Switch' 1"
                cset "name='SpkrRight DAC Switch' 1"
                cset "name='SpkrRight PBR Switch' 1"
                cset "name='SpkrRight VISENSE Switch' 1"
                cset "name='SpkrRight WSA MODE' 0"
                cset "name='SpkrRight PA Volume' 31"
                # VISENSE must be enabled on both amplifiers before either
                # DAPM mixer can prepare the coupled VI backend.
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 1"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 1"
        ]

        DisableSequence [
                # Tear down the VI backend before removing its source ports.
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 0"
                cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 0"
                cset "name='SpkrLeft COMP Switch' 0"
                cset "name='SpkrLeft BOOST Switch' 0"
                cset "name='SpkrLeft DAC Switch' 0"
                cset "name='SpkrLeft PBR Switch' 0"
                cset "name='SpkrLeft VISENSE Switch' 0"
                cset "name='SpkrRight COMP Switch' 0"
                cset "name='SpkrRight BOOST Switch' 0"
                cset "name='SpkrRight DAC Switch' 0"
                cset "name='SpkrRight PBR Switch' 0"
                cset "name='SpkrRight VISENSE Switch' 0"
        ]

        Value {
                PlaybackChannels 2
                PlaybackPriority 100
                PlaybackPCM "hw:${CardId},0"
        }
}
