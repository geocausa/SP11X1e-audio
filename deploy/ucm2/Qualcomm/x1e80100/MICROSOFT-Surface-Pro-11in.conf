Syntax 4

SectionUseCase."HiFi" {
        File "/Qualcomm/x1e80100/SP11-HiFi.conf"
        Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

# 2026-07-25 SPEAKER-COUNT CORRECTION -----------------------------------------
# Was: Include.wsa-init.File "/codecs/wsa884x/four-speakers/init.conf"
#
# The four-speaker profile remaps 'Speakers Volume' onto
#   WooferLeft PA Volume / TweeterLeft PA Volume /
#   WooferRight PA Volume / TweeterRight PA Volume
# none of which exist on this machine. Evidence for two speakers, not four:
#   - one SoundWire master (sdw-master-1-0) with exactly two peripherals,
#     sdw:1:0:0217:0204:00:0 and :1, both bound to snd_soc_wsa884x
#   - the card exposes only 'SpkrLeft *' and 'SpkrRight *' controls
#   - no WSA2 macro instance exists (single 6b10000.soundwire controller)
#   - physical teardown shows two speaker assemblies, Left and Right, with no
#     woofer/tweeter split (iFixit Device/Microsoft_Surface_Pro_11 lists exactly
#     two speaker replacement guides)
# Because the remap resolved to nonexistent controls it produced no usable
# control, which is the actual cause of WirePlumber's
# "Speakers Volume is not a volume or mute control" -- not, as previously
# recorded in SP11-HiFi.conf, a lack of remap support in spa.alsa.
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"

# 2026-07-25 WSA MACRO BOOT STATE ---------------------------------------------
# Was: Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/four-speakers/init.conf"
#
# Neither upstream wsa-macro init file is usable verbatim on this card:
#   codecs/qcom-lpass/wsa-macro/init.conf
#       uses the UNPREFIXED namespace, "name='WSA_RX0 Digital Volume'"
#   codecs/qcom-lpass/wsa-macro/four-speakers/init.conf
#       uses the right prefix but also csets 'WSA2 WSA_RX0/RX1 Digital Volume'
# This card uses the PREFIXED namespace ('WSA WSA_RX0 Digital Volume') and has
# no WSA2 macro, so the plain file fails on every line and the four-speaker file
# fails on half. There is no wsa-macro/two-speakers/ directory upstream to
# switch to, so the boot state is declared inline against the two controls that
# actually exist.
#
# Windows REV_0D DefaultDeviceVolume=0xFFF40000 is the endpoint's initial
# user-volume position (-12 dB), not a fixed WSA-macro gain. The same INF
# explicitly declares MaxEpVolume=0 dB. Pinning the macro at -12 dB therefore
# made PipeWire's 100% position 12 dB quieter than the Windows endpoint.
#
# The X1E machine driver currently exposes 81 (-3 dB) as its protected hardware
# ceiling. Use that ceiling here; user-facing attenuation remains in PipeWire.
# A later kernel change may expose 0 dB only while VI-backed speaker protection
# is confirmed active.
BootSequence [
        cset "name='WSA WSA_RX0 Digital Volume' 81"
        cset "name='WSA WSA_RX1 Digital Volume' 81"
]
