# SP11 UbiG boundary in identity/bypass mode.
#
# This is deliberately not a UbiG implementation and has no coefficients,
# gain, mixing or channel remapping. It is the stable userspace insertion point
# required by the Windows/Linux pipeline ledger: two independent copy nodes
# preserve the 48 kHz stereo stream bit-for-bit until the separate UbiG
# project has an evidence-backed implementation.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "SP11 UbiG Boundary (Bypass)"
      media.name       = "SP11 UbiG Boundary (Bypass)"
      filter.graph = {
        nodes = [
          { type = builtin name = copy_l label = copy }
          { type = builtin name = copy_r label = copy }
        ]
        inputs  = [ "copy_l:In" "copy_r:In" ]
        outputs = [ "copy_l:Out" "copy_r:Out" ]
      }
      capture.props = {
        node.name        = "effect_input.sp11_ubig_bypass"
        node.description = "SP11 UbiG Boundary (Bypass)"
        media.class      = Audio/Sink
        audio.channels   = 2
        audio.position   = [ FL FR ]
        priority.session = 1600
      }
      playback.props = {
        node.name        = "effect_output.sp11_ubig_bypass"
        node.target      = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.passive     = true
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    }
  }
]
