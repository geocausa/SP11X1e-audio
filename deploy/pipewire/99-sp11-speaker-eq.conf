# SP11 speaker tuning (reversible).
# Undo: delete this file (or restore 99-sp11-speaker-eq.conf.pre-excursion-fix-20260725)
#       then `systemctl --user restart pipewire pipewire-pulse wireplumber`.
#
# 2026-07-25 EXCURSION CORRECTION -----------------------------------------------
# The previous revision applied a +5.0 dB low SHELF at 130 Hz behind only a
# 2nd-order 60 Hz high-pass. A low shelf boosts everything BELOW its corner, so
# the 60-130 Hz octave was being lifted by up to +5 dB. That octave is where a
# 13" tablet micro-speaker has the least excursion headroom and almost no useful
# acoustic output, so the boost bought no audible bass and spent cone travel.
#
# This is only safe to do with closed-loop protection. On this machine it is NOT
# available: SpkrLeft/SpkrRight VISENSE Switch = off, CPS Switch = off, and
# WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1/2 = off, so there is no V/I telemetry
# reaching the DSP and no excursion or thermal feedback loop anywhere in the
# path. Only the amp-local analog protections (COMP, BOOST, PBR) are active.
#
# Corrections:
#   - high-pass raised 60 -> 140 Hz and made 4th-order (two cascaded Q=0.707
#     biquads, Linkwitz-Riley, 24 dB/oct) to remove sub-usable content that only
#     consumes cone travel.
#   - the +5 dB low shelf @130 is replaced by a +3.5 dB PEAK at 220 Hz (Q 0.9).
#     A peak is bounded on both sides, so perceived body is restored in the band
#     the driver can actually reproduce without extending gain down into the
#     excursion region.
#   - mid/treble stages unchanged.
# Worst-case post-preamp gain is now -0.5 dB (at 220 Hz), so the chain cannot
# clip into the DSP.
#
# Signal chain (per channel):
#   -4 dB preamp -> 140 Hz LR4 high-pass -> +3.5 dB @220 (body)
#   -> -3 dB @900 (de-box) -> +2.5 dB @3.5k (presence) -> +2 dB shelf @9k (air)
#
# NOTE: this is a userspace biquad chain, NOT the DSP path. It is an interim
# layer only. Any Windows-parity A/B measures these six biquads, not graph_105.
# Disable this file before doing parity work.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "SP11 Speaker EQ"
      media.name       = "SP11 Speaker EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = pre_l  label = bq_highshelf control = { "Freq" = 12   "Q" = 0.707 "Gain" = -4.0 } }
          { type = builtin name = hp1_l  label = bq_highpass  control = { "Freq" = 140  "Q" = 0.707 } }
          { type = builtin name = hp2_l  label = bq_highpass  control = { "Freq" = 140  "Q" = 0.707 } }
          { type = builtin name = body_l label = bq_peaking   control = { "Freq" = 220  "Q" = 0.9   "Gain" = 3.5 } }
          { type = builtin name = box_l  label = bq_peaking   control = { "Freq" = 900  "Q" = 1.2   "Gain" = -3.0 } }
          { type = builtin name = pres_l label = bq_peaking   control = { "Freq" = 3500 "Q" = 1.0   "Gain" = 2.5 } }
          { type = builtin name = air_l  label = bq_highshelf control = { "Freq" = 9000 "Q" = 0.707 "Gain" = 2.0 } }

          { type = builtin name = pre_r  label = bq_highshelf control = { "Freq" = 12   "Q" = 0.707 "Gain" = -4.0 } }
          { type = builtin name = hp1_r  label = bq_highpass  control = { "Freq" = 140  "Q" = 0.707 } }
          { type = builtin name = hp2_r  label = bq_highpass  control = { "Freq" = 140  "Q" = 0.707 } }
          { type = builtin name = body_r label = bq_peaking   control = { "Freq" = 220  "Q" = 0.9   "Gain" = 3.5 } }
          { type = builtin name = box_r  label = bq_peaking   control = { "Freq" = 900  "Q" = 1.2   "Gain" = -3.0 } }
          { type = builtin name = pres_r label = bq_peaking   control = { "Freq" = 3500 "Q" = 1.0   "Gain" = 2.5 } }
          { type = builtin name = air_r  label = bq_highshelf control = { "Freq" = 9000 "Q" = 0.707 "Gain" = 2.0 } }
        ]
        links = [
          { output = "pre_l:Out"  input = "hp1_l:In" }
          { output = "hp1_l:Out"  input = "hp2_l:In" }
          { output = "hp2_l:Out"  input = "body_l:In" }
          { output = "body_l:Out" input = "box_l:In" }
          { output = "box_l:Out"  input = "pres_l:In" }
          { output = "pres_l:Out" input = "air_l:In" }

          { output = "pre_r:Out"  input = "hp1_r:In" }
          { output = "hp1_r:Out"  input = "hp2_r:In" }
          { output = "hp2_r:Out"  input = "body_r:In" }
          { output = "body_r:Out" input = "box_r:In" }
          { output = "box_r:Out"  input = "pres_r:In" }
          { output = "pres_r:Out" input = "air_r:In" }
        ]
        inputs  = [ "pre_l:In" "pre_r:In" ]
        outputs = [ "air_l:Out" "air_r:Out" ]
      }
      capture.props = {
        node.name      = "effect_input.sp11_speaker_eq"
        node.description = "SP11 Speaker EQ"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "effect_output.sp11_speaker_eq"
        node.target    = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
