# SP11 Windows endpoint-volume / Dolby ordering.
#
# IMPORTANT: the user-facing PipeWire sink is control metadata, not the Dolby
# PCM input. WirePlumber stores its visible scalar cubically in channelVolumes;
# feeding that node directly into Dolby would attenuate PCM before VLLDP/VR.
# Windows keeps the Dolby/AudioEngine path near full scale and applies endpoint
# attenuation later in the Qualcomm final VOL_CTRL.
#
# Therefore this fragment creates two nodes:
#   1. effect_input.sp11_windows_dolby -- the only visible Audio/Sink. Its
#      unity monitor ports are the authoritative pre-Dolby PCM tap.
#   2. effect_input.sp11_windows_dolby_engine -- a hidden Stream/Input/Audio
#      hosting the recovered Windows VR -> VLLDP processor at unity input gain.
#
# deploy/dolby/sp11_dolby_monitor_link.py creates the exact two monitor->engine
# links and keeps them present across PipeWire/filter-chain recreation.
# SP11_DOLBY_PROFILE is supplied to filter-chain.service.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "SP11 Windows Dolby"
      media.name       = "SP11 Windows Dolby"
      filter.graph = {
        nodes = [
          { type = builtin name = copy_l label = copy }
          { type = builtin name = copy_r label = copy }
        ]
        inputs  = [ "copy_l:In" "copy_r:In" ]
        outputs = [ "copy_l:Out" "copy_r:Out" ]
      }
      capture.props = {
        node.name        = "effect_input.sp11_windows_dolby"
        node.description = "SP11 Windows Dolby"
        media.class      = Audio/Sink
        audio.channels   = 2
        audio.position   = [ FL FR ]
        priority.session = 1700
      }
      playback.props = {
        node.name          = "effect_output.sp11_windows_dolby_control_unused"
        node.description   = "SP11 Windows Dolby Control (unused)"
        node.passive       = true
        node.autoconnect   = false
        node.dont-reconnect = true
        audio.channels     = 2
        audio.position     = [ FL FR ]
      }
    }
  }

  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "SP11 Windows Dolby Engine"
      media.name       = "SP11 Windows Dolby Engine"
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = dolby
            plugin = "/usr/lib/ladspa/sp11_dolby_windows_chain.so"
            label  = sp11_dolby_windows_chain
            control = { "Bypass" = 0.0 "Profile" = 0.0 }
          }
        ]
        inputs  = [ "dolby:Input L" "dolby:Input R" ]
        outputs = [ "dolby:Output L" "dolby:Output R" ]
      }
      capture.props = {
        node.name          = "effect_input.sp11_windows_dolby_engine"
        node.description   = "SP11 Windows Dolby Engine"
        node.autoconnect   = false
        node.dont-reconnect = true
        audio.channels     = 2
        audio.position     = [ FL FR ]
      }
      playback.props = {
        node.name        = "effect_output.sp11_windows_dolby"
        node.description = "SP11 Windows Dolby -> Speakers"
        node.target      = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.passive     = true
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    }
  }
]
