# SP11 original Windows Dolby VLLDP -> VR, hosted out-of-process from the main
# PipeWire daemon. SP11_DOLBY_PROFILE is supplied to filter-chain.service.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "SP11 Windows Dolby"
      media.name       = "SP11 Windows Dolby"
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = dolby
            plugin = "/home/geoca/.local/lib/sp11-dolby/sp11_dolby_windows_chain.so"
            label  = sp11_dolby_windows_chain
            control = { "Bypass" = 0.0 }
          }
        ]
        inputs  = [ "dolby:Input L" "dolby:Input R" ]
        outputs = [ "dolby:Output L" "dolby:Output R" ]
      }
      capture.props = {
        node.name        = "effect_input.sp11_windows_dolby"
        node.description = "SP11 Windows Dolby"
        media.class      = Audio/Sink
        audio.channels   = 2
        audio.position   = [ FL FR ]
        priority.session = 1700
      }
      playback.props = {
        node.name        = "effect_output.sp11_windows_dolby"
        node.description = "SP11 Windows Dolby -> Speakers"
        node.target      = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.passive     = true
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    }
  }
]
