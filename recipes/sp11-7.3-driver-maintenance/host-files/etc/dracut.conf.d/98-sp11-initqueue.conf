# console-setup invokes /sbin/initqueue; dracut112 no longer includes it implicitly.
add_dracutmodules+=" initqueue "
# The reporting guard needs the normal root filesystem's Python runtime.
# Its dedicated service applies the rule before UPower coldplug after switch-root.
remove_items+=" /etc/udev/rules.d/99-sp11-battery-reporting.rules "
